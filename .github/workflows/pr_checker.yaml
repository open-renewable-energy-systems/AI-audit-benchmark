#
# YAML file configuring the actions to take when releasing to production
#
# > Syntax tips here: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
name: Pull request checker

on:
  pull_request

jobs:
  check_pull_request:
    name: check pull request

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create UV installation"
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"

      # Check and fix the code
      - name: Defining Git identity
        run: |
          git config user.name github_actions
          git config user.email github_actions@pierrevf.com

      #- name: Generate requirements files for app
      #  run: |
      #    uv sync --group=app
      #    uv pip freeze --exclude-editable > requirements-app.txt

      - name: Run code cleanup
        run: |
          uv tool run pre-commit install
          uv tool run pre-commit run --all || echo "Precommits modified the files"

      - name: Commit changes back
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          author_name: github_actions
          message: "Automatic code reformatting using pre-commits"
          add: "."
          push: true
